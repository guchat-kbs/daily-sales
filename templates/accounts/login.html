{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Assam Dart</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-black text-white">

    <main class="flex min-h-screen items-center justify-center px-4">

        <div class="w-full max-w-md">

            <!-- Logo -->

            <div class="mb-8 text-center">

                <h1 class="text-4xl font-black tracking-wider">
                    ASSAM DART
                </h1>

                <p class="mt-2 text-sm text-zinc-500">
                    Please enter your provided username and password to login
                </p>

            </div>


            <!-- Login Card -->

            <div class="rounded-2xl border border-zinc-800 bg-zinc-950 p-6 sm:p-8">

                <h2 class="mb-6 text-2xl font-bold">
                    Login
                </h2>


                <!-- Messages -->

{% if messages %}

    {% for message in messages %}

        <div class="mb-4 rounded-xl border border-red-500/30
                    bg-red-500/10 px-4 py-3 text-sm text-red-400">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <!-- Username -->

                    <div class="mb-4">

                        <label
                            for="username"
                            class="mb-2 block text-sm font-medium text-zinc-400"
                        >
                            Username
                        </label>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                            autofocus
                            class="w-full rounded-xl border border-zinc-700
                                   bg-black px-4 py-3 text-white
                                   outline-none transition
                                   focus:border-blue-500"
                        >

                    </div>


                    <!-- Password -->

                    <div class="mb-6">

                        <label
                            for="password"
                            class="mb-2 block text-sm font-medium text-zinc-400"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            class="w-full rounded-xl border border-zinc-700
                                   bg-black px-4 py-3 text-white
                                   outline-none transition
                                   focus:border-blue-500"
                        >

                    </div>


                    <!-- Login -->

                    <button
                        type="submit"
                        class="w-full rounded-xl bg-blue-600 px-4 py-3
                               font-black transition
                               hover:bg-blue-500
                               active:scale-[0.98]"
                    >
                        LOGIN
                    </button>

                </form>

            </div>

        </div>

    </main>

</body>

</html>
