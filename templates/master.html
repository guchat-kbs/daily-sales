{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assam Dart — Master</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-slate-50 text-slate-900">

    <div class="mx-auto max-w-4xl px-4 py-6">


        <!-- HEADER -->

        <header
            class="flex items-center
                   justify-between
                   border-b border-slate-200
                   pb-5"
        >

            <div>

                <h1
                    class="text-xl font-black
                           tracking-[0.2em]"
                >
                    ASSAM DART
                </h1>

                <p
                    class="mt-1 text-xs
                           font-bold
                           text-red-600"
                >
                    MASTER
                </p>

            </div>


            <a
                href="{% url 'logout' %}"
                class="rounded-lg
                       bg-red-600
                       px-3 py-2
                       text-xs font-bold
                       text-white
                       shadow-sm
                       transition
                       hover:bg-red-700"
            >
                LOGOUT
            </a>

        </header>


        <!-- TITLE -->

        <div class="mt-8">

            <p
                class="text-sm
                       font-medium
                       text-slate-500"
            >
                TODAY'S TOTAL
            </p>

            <h2
                class="mt-1 text-3xl
                       font-black"
            >
                MASTER PANEL
            </h2>

        </div>


        <!-- FR / SR BUTTONS -->

        <div
            class="mt-8 grid
                   grid-cols-2
                   gap-3"
        >

            <button
                id="fr-button"
                class="rounded-xl
                       bg-red-600
                       px-4 py-4
                       font-black
                       text-white
                       shadow-sm
                       transition
                       hover:bg-red-700"
            >
                FR
            </button>


            <button
                id="sr-button"
                class="rounded-xl
                       bg-blue-600
                       px-4 py-4
                       font-black
                       text-white
                       shadow-sm
                       transition
                       hover:bg-blue-700"
            >
                SR
            </button>

        </div>


        <!-- TOTAL -->

        <div
            class="mt-6 rounded-2xl
                   border border-slate-200
                   bg-white
                   p-6
                   shadow-sm"
        >

            <div
                id="total-label"
                class="text-sm
                       font-bold
                       text-slate-500"
            >
                FR GRAND TOTAL
            </div>


            <div
                id="grand-total"
                class="mt-3 text-5xl
                       font-black
                       text-emerald-600"
            >
                ₹0.00
            </div>

        </div>


        <!-- DATE -->

        <div
            id="current-date"
            class="mt-5 text-center
                   text-sm
                   text-slate-500"
        >
            Loading...
        </div>


    </div>


<script>

    let currentType = "FR";


    async function loadTotal() {

        const totalElement =
            document.getElementById("grand-total");

        totalElement.textContent = "Loading...";


        try {

            const response = await fetch(
                `/api/master-total/?type=${currentType}`
            );


            if (!response.ok) {

                throw new Error(
                    "Failed to load total."
                );

            }


            const data = await response.json();


            totalElement.textContent =
                `₹${Number(data.grand_total).toFixed(2)}`;


        } catch (error) {

            totalElement.textContent =
                "Error";

            console.error(error);

        }

    }


    function selectType(type) {

        currentType = type;


        document.getElementById(
            "total-label"
        ).textContent =
            `${type} GRAND TOTAL`;


        const frButton =
            document.getElementById("fr-button");

        const srButton =
            document.getElementById("sr-button");


        if (type === "FR") {

            frButton.className =
                "rounded-xl bg-red-600 px-4 py-4 font-black text-white shadow-sm transition hover:bg-red-700 ring-2 ring-red-600 ring-offset-2";

            srButton.className =
                "rounded-xl bg-blue-600/40 px-4 py-4 font-black text-white shadow-sm transition hover:bg-blue-600";

        } else {

            frButton.className =
                "rounded-xl bg-red-600/40 px-4 py-4 font-black text-white shadow-sm transition hover:bg-red-600";

            srButton.className =
                "rounded-xl bg-blue-600 px-4 py-4 font-black text-white shadow-sm transition hover:bg-blue-700 ring-2 ring-blue-600 ring-offset-2";

        }


        loadTotal();

    }


    document
        .getElementById("fr-button")
        .addEventListener(
            "click",
            () => selectType("FR")
        );


    document
        .getElementById("sr-button")
        .addEventListener(
            "click",
            () => selectType("SR")
        );


    const today =
        new Date();


    document.getElementById(
        "current-date"
    ).textContent =
        today.toLocaleDateString(
            "en-IN",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );


    loadTotal();

</script>

</body>

</html>
